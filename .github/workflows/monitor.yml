# RETIRED — 6 August 2026.
#
# This action ran every 6 hours from December 2025 to August 2026, counting the
# days since the DOJ released 931,000 files and the arrests that followed. It
# counted to 230 days and 0 arrests.
#
# They are never going to arrest anyone. The counter is stopped.
#
# The schedule is removed and the workflow is disabled in the Actions tab.
# Nothing runs on its own anymore. The manifests, the changelog, and the flight
# data stay exactly where they are — the record is the point, not the ticking.
# The job below is kept as a record of what ran; even if it were re-enabled the
# counter stays frozen (see COUNTER_RETIRED in tools/monitor.py).

name: Monitor Epstein Files Index (RETIRED)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run in seed mode (builds initial manifests from scratch)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Run monitor
        run: |
          if [ "${{ github.event.inputs.seed }}" = "true" ]; then
            python tools/monitor.py --seed
          else
            python tools/monitor.py
          fi

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/ CHANGELOG.md README.md banner.svg docs/
          DATASETS_CHANGED=$(git diff --cached --name-only manifests/ | grep -c 'dataset-' || true)
          DATE=$(date -u +%Y-%m-%d)
          if [ "${{ github.event.inputs.seed }}" = "true" ]; then
            git commit -m "seed: initial manifest build — ${DATE}"
          elif [ "$DATASETS_CHANGED" -gt 0 ]; then
            git commit -m "monitor: changes detected in ${DATASETS_CHANGED} dataset(s) — ${DATE}"
          else
            git commit -m "monitor: check completed — ${DATE}"
          fi
          git push
